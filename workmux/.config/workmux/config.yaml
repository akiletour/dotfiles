nerdfont: true
agent: claude
base_branch: auto
merge_strategy: rebase
window_prefix: "wm-"
status_format: false

panes:
  - command: <agent>
    focus: true
  - command: inr-worktree up
    split: horizontal
    percentage: 30

files:
  copy:
    - .env
    - .env.local

post_create:
  - inr-worktree setup
  - "[ -f .envrc ] && direnv allow || true"

pre_remove:
  - inr-worktree down
  - "<cleanup-node-modules>"
