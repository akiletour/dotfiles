set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

set -sg escape-time 10
set -g focus-events on
set -g extended-keys on
set -g mouse on
set -g history-limit 1000000

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

bind-key H swap-window -t -1\; select-window -t -1
bind-key L swap-window -t -1\; select-window -t +1

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z
bind * setw synchronize-panes \; display "Synchronisation des panneaux : #{?pane_synchronized,ON,OFF}"

set -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind T display-popup -E -w 80% -h 70% "sesh picker -idHs --preview"
bind BSpace run-shell "sesh last"
set-hook -g session-created 'run-shell -b "sesh cache refresh"'
set-hook -g session-closed 'run-shell -b "sesh cache refresh"'
bind e new-window -n editor -c "#{pane_current_path}" nvim
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind K display-popup -E -w 90% -h 90% "k9s -A"
bind D display-popup -E -w 90% -h 90% lazydocker
bind S display-popup -E -w 90% -h 90% swarm
bind t display-popup -E -w 85% -h 80% "tv"
bind W display-popup -E -w 90% -h 90% "workmux dashboard"
bind N run-shell "workmux last-done"
bind Y run-shell "~/.config/tmux/scripts/copy-last-line.sh '#{pane_id}'" \; display "Dernière ligne copiée"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'Morantron/tmux-fingers'
set -g @fingers-key Space
set -g @fingers-keyboard-layout colemak
set -g @plugin 'j4hangir/tmux-jump'
set -g @jump-key s
set -g @jump-hints 'arstneiowf'
set -g @jump-skip-wizard 1
set -g @plugin 'Kristijan/flash-copy.tmux'
set -g @flash-copy-bind-key f
set -g @flash-copy-label-characters "arstneiowfyuplgmchdz"
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'wfxr/tmux-fzf-url'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @fzf-url-fzf-options '-w 60% -h 40% --prompt "url> "'
set -g @fzf-url-history-limit '2000'

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "#{@thm_bg}"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W#{?@workmux_status, #{@workmux_status},}"
set -g @catppuccin_window_current_text " #W#{?@workmux_status, #{@workmux_status},}#{?window_zoomed_flag, \U000F004C,}"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_status_left_separator "\uE0B6"
set -g @catppuccin_status_right_separator "\uE0B4"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text " #{b:pane_current_path}"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g automatic-rename on
set -g automatic-rename-format "#{?#{m/r:^[0-9]+\\.[0-9]+\\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}"
set -g status-position top
set -g status-justify absolute-centre
set -g window-status-separator " "

set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session} "

set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_directory} #(~/.config/tmux/scripts/kube-context.sh)"

setw -g pane-border-status bottom
setw -g pane-border-format ""
setw -g pane-border-lines single
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"

run '~/.tmux/plugins/tpm/tpm'
bind f run-shell 'PYTHONWARNINGS=ignore::SyntaxWarning ~/.tmux/plugins/flash-copy.tmux/bin/tmux-flash-copy.py --pane-id "#{pane_id}" --client-name "#{client_name}"'
